[project]
name = "noa-api"
version = "0.1.0"
description = "NOA AI FastAPI gateway"
requires-python = ">=3.9"
dependencies = [
    "arq>=0.25",
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pdf2image>=1.17",
    "pillow>=10.0",
    "openai>=1.0",
    "trimesh>=4.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "shapely>=2.0",
    "scipy>=1.11",
    "pytesseract>=0.3.10",
    "noa-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
# Real CLIP image embeddings (ViT-L/14). Without this extra the embedding
# provider uses its deterministic non-semantic hash fallback (CLIP_BACKEND=auto).
clip = ["open_clip_torch>=2.20", "torch>=2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
