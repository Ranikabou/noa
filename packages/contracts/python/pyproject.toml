[project]
name = "noa-contracts"
version = "0.1.0"
description = "NOA canonical contracts — Pydantic v2 (snapshot-tested with TS)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-snapshot>=0.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["noa_contracts*"]
